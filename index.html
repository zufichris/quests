<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seventy-Five Days</title>
<meta name="description" content="One quest set a day. Seventy-five days. Nothing leaves this device.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0;1,9..144,300..600,0&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c2822a'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5efe4;
    --bg-deep: #ede5d6;
    --card: #fdf9f1;
    --ink: #1d1a16;
    --ink-soft: #4a433b;
    --muted: #857a6d;
    --line: rgba(29, 26, 22, 0.12);
    --line-strong: rgba(29, 26, 22, 0.28);
    --accent: #b97a25;
    --accent-soft: rgba(185, 122, 37, 0.14);
    --shadow: 0 1px 0 rgba(29,26,22,0.04), 0 12px 40px -24px rgba(29,26,22,0.35);
    --serif: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121010;
      --bg-deep: #0c0b0a;
      --card: #1a1715;
      --ink: #efe6d8;
      --ink-soft: #c9bfb0;
      --muted: #8f8477;
      --line: rgba(239, 230, 216, 0.11);
      --line-strong: rgba(239, 230, 216, 0.3);
      --accent: #d9a04a;
      --accent-soft: rgba(217, 160, 74, 0.16);
      --shadow: 0 1px 0 rgba(0,0,0,0.3), 0 16px 48px -28px rgba(0,0,0,0.9);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121010;
    --bg-deep: #0c0b0a;
    --card: #1a1715;
    --ink: #efe6d8;
    --ink-soft: #c9bfb0;
    --muted: #8f8477;
    --line: rgba(239, 230, 216, 0.11);
    --line-strong: rgba(239, 230, 216, 0.3);
    --accent: #d9a04a;
    --accent-soft: rgba(217, 160, 74, 0.16);
    --shadow: 0 1px 0 rgba(0,0,0,0.3), 0 16px 48px -28px rgba(0,0,0,0.9);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(1200px 600px at 50% -200px, var(--card), transparent 70%);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  ::selection { background: var(--accent-soft); }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px calc(48px + env(safe-area-inset-bottom));
  }

  /* progress rule */
  .rule {
    display: grid;
    grid-template-columns: repeat(75, 1fr);
    gap: 2px;
    padding-top: calc(14px + env(safe-area-inset-top));
    height: 20px;
  }
  .rule i {
    display: block;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    transition: background .6s ease, transform .6s ease;
  }
  .rule i.past { background: var(--line-strong); }
  .rule i.now  { background: var(--accent); transform: scaleY(1.9); }
  .rule i.now.done { animation: glow 1.4s ease-out 1; }
  @keyframes glow {
    0%   { box-shadow: 0 0 0 0 var(--accent-soft); }
    60%  { box-shadow: 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 12.5px;
    letter-spacing: .02em;
    color: var(--muted);
  }
  .top .meta { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .top .meta span + span::before { content: "·"; margin-right: 10px; opacity: .6; }
  .icon-btn {
    width: 40px; height: 40px;
    border: 0; background: transparent; border-radius: 999px;
    display: grid; place-items: center; cursor: pointer;
    color: var(--muted);
    transition: background .2s, color .2s;
    margin-right: -10px;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* day header */
  .day {
    margin-top: 28px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  .num {
    font-family: var(--serif);
    font-weight: 300;
    font-variation-settings: "opsz" 144, "SOFT" 0;
    font-size: clamp(112px, 30vw, 184px);
    line-height: .82;
    letter-spacing: -0.045em;
    margin-left: -0.04em;
    color: var(--ink);
    transition: color 1.2s ease;
    font-feature-settings: "lnum", "pnum";
  }
  .done .num { color: var(--accent); }
  .of {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    font-size: 22px;
    color: var(--muted);
    letter-spacing: -0.01em;
  }
  .sub {
    margin-top: 18px;
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 300;
    line-height: 1.4;
    color: var(--ink-soft);
    max-width: 44ch;
    letter-spacing: -0.005em;
  }
  .sub b { font-weight: 500; color: var(--ink); }
  .complete-line {
    margin-top: 14px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 17px;
    color: var(--accent);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 1s ease .3s, transform 1s ease .3s;
    height: 0;
    overflow: hidden;
  }
  .done .complete-line { opacity: 1; transform: none; height: auto; }

  /* cards */
  .cards { margin-top: 34px; display: grid; gap: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px 20px 18px;
    box-shadow: var(--shadow);
  }
  .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .label small { font-weight: 500; letter-spacing: .02em; text-transform: none; font-size: 11.5px; opacity: .85; margin-left: auto; }
  .label .prog { font-weight: 500; letter-spacing: .02em; text-transform: none; font-size: 11.5px; color: var(--accent); margin-left: 12px; font-variant-numeric: tabular-nums; }
  .label small + .prog { margin-left: 12px; }
  .label { justify-content: flex-start; }
  .sec { margin-top: 14px; }
  .sec:first-of-type { margin-top: 2px; }
  .sech {
    font-family: var(--serif);
    font-size: 17.5px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0 0 2px;
    line-height: 1.3;
  }
  .secnote { margin: 4px 0 2px 38px; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .secnote.theory { margin-left: 0; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .card .txt { font-size: 15.5px; }

  .q {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 14px;
    align-items: start;
    padding: 6px 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .q input { position: absolute; opacity: 0; width: 0; height: 0; }
  .box {
    width: 24px; height: 24px; margin-top: 1px;
    border-radius: 7px;
    border: 1.5px solid var(--line-strong);
    display: grid; place-items: center;
    background: transparent;
    transition: background .25s ease, border-color .25s ease, transform .18s ease;
  }
  .q:active .box { transform: scale(.92); }
  .box svg { width: 15px; height: 15px; }
  .box path {
    fill: none;
    stroke: var(--card);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 24;
    stroke-dashoffset: 24;
    transition: stroke-dashoffset .35s cubic-bezier(.2,.8,.2,1) .05s;
  }
  .q input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .q input:checked + .box path { stroke-dashoffset: 0; }
  .q input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 3px; }
  .txt {
    font-size: 16.5px;
    line-height: 1.5;
    color: var(--ink);
    text-decoration: line-through;
    text-decoration-color: transparent;
    text-decoration-thickness: 1px;
    text-underline-offset: 0;
    transition: color .4s ease, text-decoration-color .45s ease .1s;
  }
  .q input:checked ~ .txt { color: var(--muted); text-decoration-color: var(--accent); }

  .note {
    display: inline-block;
    width: 100%;
    margin-top: 6px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--muted);
    text-decoration: none;
  }
  .q input:checked ~ .txt .note { opacity: .6; }
  button.ref {
    border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit;
    color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent-soft);
  }
  button.ref:hover { text-decoration-color: var(--accent); }
  .foot button.ref { color: var(--muted); text-decoration-color: var(--line-strong); font-size: 13px; }
  .foot button.ref:hover { color: var(--ink); }
  .refnav { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 18px 0 6px; font-size: 13.5px; }
  .refsec { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); font-size: 15px; color: var(--ink-soft); }
  .refsec h3 { font-family: var(--serif); font-weight: 400; font-size: 26px; letter-spacing: -0.015em; color: var(--ink); margin: 0 0 10px; }
  .refsec h4 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 22px 0 8px; }
  .refsec p { margin: 8px 0; }
  .refsec ul, .refsec ol { padding-left: 20px; margin: 8px 0; }
  .refsec li { margin: 6px 0; }
  .refsec b { color: var(--ink); font-weight: 600; }
  .refsec p.unit { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--ink); margin: 14px 0 4px; }
  .refsec ol li { margin: 3px 0; }
  .refsec pre {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    font-size: 13px; line-height: 1.5; overflow-x: auto; color: var(--ink);
  }
  .card.every { background: transparent; border-color: transparent; box-shadow: none; padding: 8px 4px 0; }
  .card.every .txt { font-size: 14.5px; color: var(--ink-soft); }
  .card.every .box { width: 20px; height: 20px; border-radius: 6px; margin-top: 2px; }
  .card.every .box svg { width: 12px; height: 12px; }
  .card.every .q { grid-template-columns: 20px 1fr; gap: 12px; padding: 5px 0; }
  .card.every .label { margin-bottom: 6px; }

  /* footer */
  .foot {
    margin-top: 44px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
  }
  .foot button {
    border: 0; background: transparent; padding: 0; cursor: pointer;
    color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong);
  }
  .foot button:hover { color: var(--ink); }
  details.rules { margin-top: 18px; font-size: 14px; color: var(--ink-soft); }
  details.rules summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
  details.rules summary::-webkit-details-marker { display: none; }
  details.rules summary::before { content: "+ "; }
  details[open].rules summary::before { content: "− "; }
  details.rules ul { margin: 10px 0 0; padding-left: 18px; }
  details.rules li { margin: 6px 0; }

  /* begin / done / wait / all screens */
  .screen {
    min-height: 100dvh;
    display: flex; flex-direction: column; justify-content: safe center;
    padding: 72px 0 10vh;
  }
  .screen h1 {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(44px, 11vw, 84px);
    line-height: .98;
    letter-spacing: -0.03em;
    margin: 0 0 22px;
    font-variation-settings: "opsz" 144;
  }
  .screen h1 em { font-style: italic; color: var(--accent); }
  .screen p { max-width: 46ch; color: var(--ink-soft); font-size: 17px; margin: 0 0 12px; }
  .actions { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn {
    border: 1px solid var(--ink);
    background: var(--ink); color: var(--bg);
    border-radius: 999px; padding: 13px 22px;
    font-weight: 500; cursor: pointer; font-size: 15px;
    transition: transform .15s ease, opacity .2s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .fine { font-size: 13px; color: var(--muted); margin-top: 22px; }

  /* all days list */
  .all { margin-top: 28px; }
  .all h2 {
    font-family: var(--serif); font-weight: 300; font-size: 34px; letter-spacing: -0.02em; margin: 0 0 6px;
  }
  .all .back { font-size: 13px; color: var(--muted); background: transparent; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .week { margin-top: 34px; }
  .week h3 {
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 4px;
  }
  .week .theme { font-family: var(--serif); font-style: italic; color: var(--ink-soft); font-size: 16px; margin-bottom: 12px; }
  .row {
    display: grid; grid-template-columns: 52px 1fr; gap: 12px;
    padding: 14px 0; border-top: 1px solid var(--line);
  }
  .row.today { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 10px; border-top-color: transparent; }
  .row .d { font-family: var(--serif); font-size: 28px; font-weight: 300; line-height: 1; color: var(--ink); letter-spacing: -0.02em; }
  .row .d small { display: block; font-family: var(--sans); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .row .c { font-size: 14px; color: var(--ink-soft); display: grid; gap: 6px; }
  .row .c span b { font-weight: 600; color: var(--muted); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; margin-right: 8px; }

  .tag {
    display: inline-block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px; margin-left: 10px; vertical-align: middle;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

  function tocHtml() {
    const list = (arr, from, to) => `<ol start="${from}">${arr.slice(from - 1, to).map(x => `<li>${x}</li>`).join("")}</ol>`;
    const group = (title, arr, groups) => `<h4>${title}</h4>` + groups.map(([g, a, b]) => `<p class="unit">${g}</p>${list(arr, a, b)}`).join("");
    return `
<p>Everything Sprint 1 covers, in the order it is crushed. Each line is one checkable topic on one day. The next sprint’s tables are at the end so what comes after is never a mystery.</p>
${group("Linear algebra, 28 topics, final on day 42", LA, [["Solving linear systems", 1, 8], ["Vector spaces", 9, 17], ["Determinants and eigenvalues", 18, 24], ["Beyond", 25, 28]])}
${group("Multivariable calculus, 33 topics, final on day 47", MV, [["Unit 1, vectors and matrices", 1, 6], ["Unit 2, partial derivatives", 7, 15], ["Unit 3, double integrals and line integrals in the plane", 16, 24], ["Unit 4, triple integrals and surface integrals", 25, 33]])}
${group("Discrete mathematics, 16 topics, final on day 56", DM, [["Part I, proofs", 1, 8], ["Part II, structures", 9, 13], ["Part III, counting", 14, 16]])}
${group("A computer from NAND, 7 projects, done by day 42", NAND, [["Hardware then software", 1, 7]])}
${group("Electronics theory, 31 topics, in the order the bench meets them", EL, [["Passives and signals", 1, 7], ["Semiconductors", 8, 11], ["Op-amps, timers, technique", 12, 15], ["Transistor circuits", 16, 18], ["Digital, power, systems", 19, 31]])}
<h4>Head starts for Sprint 2</h4>
<p class="unit">Differential equations, 12 topics, weeks 8 to 10</p>${list(DE, 1, DE.length)}
<p class="unit">Computer systems, 4 topics, weeks 9 to 10</p>${list(CS, 1, CS.length)}
<h4>Sprint 2 and after</h4>
<p>Differential equations continued, probability, classical mechanics, algorithms, computer systems in full, the NAND computer’s virtual machine and compiler, bare-metal microcontroller programming, and electromagnetism. Written on day 74 in this same shape.</p>`;
  }

<p>A 555 astable driving an LED, with a potentiometer for frequency and test points so the scope can see it. Two layers, about 50 by 30 mm, ground pour on the back.</p>
<h4>Schematic</h4>
<ul>
<li>555: pin 8 VCC and pin 4 RESET to +V. Pin 1 to GND.</li>
<li>R1, 1 kΩ, from +V to pin 7 DISCHARGE.</li>
<li>R2, a 10 kΩ potentiometer in series with 1 kΩ, from pin 7 to pins 6 THRESHOLD and 2 TRIGGER, which are tied together.</li>
<li>C1, 10 µF, from pins 2/6 to GND.</li>
<li>C2, 10 nF, from pin 5 CONTROL to GND.</li>
<li>C3, 100 nF decoupling across pins 8 and 1, right at the chip.</li>
<li>Pin 3 OUTPUT through 330 Ω to an LED to GND.</li>
<li>Test points: TP1 on pin 3, TP2 on pins 2/6, TP3 on +V, TP4 on GND.</li>
<li>Power: barrel jack or 9 V battery clip, anything from 5 to 12 V. A reverse-polarity diode in series is a good habit.</li>
</ul>
<h4>Predictions</h4>
<p>f = 1.44 / ((R1 + 2·R2) · C1). Duty = (R1 + R2) / (R1 + 2·R2). With R1 = 1 kΩ, R2 from 1 kΩ to 11 kΩ, C1 = 10 µF, f runs from about 48 Hz down to about 6 Hz.</p>
<h4>Schedule</h4>
<p>Breadboard on day 16. Schematic day 18, parts ordered day 19, layout day 21, board ordered day 22, arrives around day 36, enclosure days 34 to 39, capstone write-up days 60 to 71.</p>
<h4>Fab</h4>
<p>Export Gerbers and the drill file from KiCad with your fab’s settings. Any prototype service works; JLCPCB, PCBWay and OSH Park are the usual ones. Five boards cost a few dollars plus shipping and take one to three weeks. If the board is late, the day 36 fallback is the same circuit soldered permanently on perfboard.</p>` },
    { id: "labs", title: "Bench labs", body: `
<p>Each lab is built, measured, and written into the log with a predicted-against-measured table.</p>
<ul>
<li><b>Using the scope properly, day 22.</b> Compensate the probe on the calibration output. Edge trigger on your 555, then try auto, normal and single. AC against DC coupling on a signal with offset. Move the ground clip far from the probe tip and watch the noise. Bandwidth limit on and off.</li>
<li><b>RC and RL filters with phase, day 29.</b> Build an RC low-pass and high-pass. Sweep 10 Hz to 100 kHz at each decade and half-decade. Record amplitude ratio and phase shift at each point, phase from the time offset between channels. Plot against the predicted curves. Repeat with an RL if you have an inductor.</li>
<li><b>Bring-up, day 36.</b> Visual inspection under the loupe. Continuity on every net against the schematic, power nets first. Short check between +V and GND. Power through the bench supply with a 50 mA current limit. Measure +V at TP3, then the output at TP1.</li>
<li><b>Fault finding, days 67 and 68.</b> Known-good reference first. Power rails, then the clock or oscillator, then signal path in order. Change one thing at a time. Write down each step before you take it.</li>
</ul>` },
    { id: "writeups", title: "Write-up templates", body: `
<h4>Build write-up, days 37, 42, 63 and the capstone</h4>
<ol>
<li>What it is, in two sentences.</li>
<li>Photos: the build, and for a board, the enclosure and the assembly.</li>
<li>Schematic and layout images, or the CAD drawing.</li>
<li>Measurements: a table of predicted, measured, and percent error for every number you took.</li>
<li>What went wrong, and what you would change.</li>
<li>For the capstone, the drawing package and the BOM.</li>
</ol>
<h4>The computer you built, day 42</h4>
<p>One section per layer, gates to assembler. For each: what it does, what it is built from, and why the layer has to exist. End with what surprised you.</p>
<h4>Close-out essay, day 68</h4>
<ol>
<li>What the subject is actually about, now that you have done it.</li>
<li>What surprised you.</li>
<li>What still confuses you.</li>
<li>How it connects to what came before.</li>
<li>What the foundational reading added that the course did not.</li>
</ol>
<h4>Sprint review, day 73</h4>
<ol>
<li>Hours per stream per week, from the log.</li>
<li>Every gate attempted, with the score.</li>
<li>Actual against planned, where the plan was wrong, and why.</li>
<li>What to keep, what to drop.</li>
<li>The Sprint 2 list.</li>
</ol>` },
    { id: "sketch", title: "Sketchbook weeks", body: `
<p>One page every day. The week sets the exercise.</p>
<ol>
<li><b>Lines, circles, ellipses.</b> Pages of freehand parallel lines, horizontal and vertical. Circles. Ellipses at several minor-axis ratios, drawn through, not sketched in pieces.</li>
<li><b>Cubes in two-point perspective.</b> Horizon line, two vanishing points, cubes above, below and on the horizon.</li>
<li><b>Cylinders, cones, combined primitives.</b> Ellipses on an axis. Then combine primitives into simple objects: a bottle, a torch, a motor.</li>
<li><b>Orthographic views of real objects.</b> One object a day, front, top and right views by hand, proportions by eye, then checked with calipers.</li>
<li><b>Sections and dimensioning.</b> Section views of this week’s objects. Dimension them fully: every feature once, from a datum, with tolerances.</li>
<li><b>Exploded views.</b> Simple assemblies pulled apart along their axes: a pen, a torch, your fastened assembly.</li>
<li><b>Mechanisms.</b> Five a day copied from a mechanisms catalogue. Brown’s <i>507 Mechanical Movements</i> is public domain and free online. Understand each one as you draw it.</li>
<li><b>Enclosure concepts.</b> Six thumbnails a day for the board’s enclosure. Vary the form, not the details.</li>
<li><b>Line weight and shading.</b> One light source. Three line weights. Cast shadows.</li>
<li><b>Assembly drawings.</b> Board and enclosure together, with balloons and a parts list.</li>
<li><b>Free choice.</b> Then pick the ten best pages of the sprint.</li>
</ol>` },
    { id: "sources", title: "Suggested sources", body: `
<p>Suggestions only. Any equivalent source is fine. The quests name topics; these are the standard routes to them.</p>
<ul>
<li><b>Multivariable calculus, differential equations, linear algebra.</b> Any full university course with problem sets and past exams. Textbooks: Stewart or Marsden and Tromba for calculus; Boyce and DiPrima or Strang for differential equations; Strang or Axler for linear algebra.</li>
<li><b>Discrete mathematics.</b> Lehman, Leighton and Meyer, <i>Mathematics for Computer Science</i>, free PDF. Rosen as an alternative.</li>
<li><b>A computer from NAND.</b> Nand2Tetris, free course, book and simulator at nand2tetris.org.</li>
<li><b>How a computer works.</b> Petzold, <i>Code</i>.</li>
<li><b>Computer systems.</b> Bryant and O’Hallaron, <i>Computer Systems: A Programmer’s Perspective</i>. Its self-study labs, the data lab for bit puzzles and the bomb lab for reverse-engineering, are public on the book’s site.</li>
<li><b>Electronics theory.</b> Scherz and Monk, <i>Practical Electronics for Inventors</i>, for components as objects. Horowitz and Hill, <i>The Art of Electronics</i>, chapters 1 to 3 and 10, for depth. Hayes and Horowitz, <i>Learning the Art of Electronics</i>, for more labs. Datasheets from the manufacturer for every chip you touch.</li>
<li><b>Application note.</b> Jim Williams, Linear Technology AN-47, <i>High Speed Amplifier Techniques</i>, free from Analog Devices.</li>
<li><b>Troubleshooting.</b> Bob Pease, <i>Troubleshooting Analog Circuits</i>, originally a free article series.</li>
<li><b>Fields.</b> Feynman Lectures on Physics, volume II, chapter 1, free at feynmanlectures.caltech.edu.</li>
<li><b>Drawing.</b> Giesecke, <i>Technical Drawing with Engineering Graphics</i>. Eissen and Steur, <i>Sketching</i>. Brown, <i>507 Mechanical Movements</i>, free.</li>
<li><b>Prototyping.</b> Dan Gelbart, <i>Building Prototypes</i>, free video series.</li>
</ul>` }
  ];

  const THEMES = [
    "lines, circles and ellipses",
    "cubes in two-point perspective",
    "cylinders, cones and combined primitives",
    "orthographic views of real objects",
    "sections and dimensioning",
    "exploded views",
    "mechanisms from 507 Mechanical Movements",
    "enclosure concepts",
    "line weight and shading",
    "assembly drawings",
    "free choice, and a review of the sketchbook"
  ];

  const DOW = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const TOTAL = 75;

  // ------------------------------------------------------------
  // Storage (all local, wrapped)
  // ------------------------------------------------------------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
    keys() { try { return Object.keys(localStorage); } catch { return []; } }
  };

  // ------------------------------------------------------------
  // Theme
  // ------------------------------------------------------------
  const root = document.documentElement;
  const savedTheme = store.get("theme");
  if (savedTheme === "light" || savedTheme === "dark") root.setAttribute("data-theme", savedTheme);
  function currentTheme() {
    const t = root.getAttribute("data-theme");
    if (t) return t;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function toggleTheme() {
    const next = currentTheme() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store.set("theme", next);
    render();
  }

  // ------------------------------------------------------------
  // Dates
  // ------------------------------------------------------------
  const DAY_MS = 86400000;
  function localMidnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function fmtDate(d) {
    return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  }
  function parseISO(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function toISO(d) {
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function nextMonday(from) {
    const d = localMidnight(from);
    const diff = (8 - d.getDay()) % 7 || 7; // days until next Monday (never 0)
    return new Date(d.getTime() + diff * DAY_MS);
  }

  const params = new URLSearchParams(location.search);
  const previewDay = params.has("day") ? Math.max(0, parseInt(params.get("day"), 10) || 0) : null;
  const preview = previewDay !== null;

  function computeDay() {
    if (preview) return previewDay;
    const start = store.get("startDate");
    if (!start) return null; // not begun
    const s = parseISO(start);
    const t = localMidnight(new Date());
    return Math.floor((t - s) / DAY_MS) + 1; // may be <= 0 if start is in the future
  }

  // ------------------------------------------------------------
  // Per-day state
  // ------------------------------------------------------------
  function dayKey(n) { return `day-${n}`; }
  function loadChecks(n) {
    if (preview) return previewState[n] || [];
    try { return JSON.parse(store.get(dayKey(n)) || "[]"); } catch { return []; }
  }
  function saveChecks(n, arr) {
    if (preview) { previewState[n] = arr; return; }
    store.set(dayKey(n), JSON.stringify(arr));
  }
  const previewState = {};
  function dayIds(d) {
    return [
      ...d.t.flatMap((sec, si) => sec.items.map((_, ii) => `t${si}.${ii}`)),
      ...d.b.flatMap((sec, si) => sec.items.map((_, ii) => `b${si}.${ii}`)),
      "e1", "e2"
    ];
  }
  // Preview helpers: ?day=N&done=1 shows the completed state, ?theme=dark forces a theme. Neither persists.
  if (preview && params.has("done") && DAYS[previewDay - 1]) previewState[previewDay] = dayIds(DAYS[previewDay - 1]);
  if (preview && (params.get("theme") === "dark" || params.get("theme") === "light")) root.setAttribute("data-theme", params.get("theme"));
  let showAll = preview && params.has("all");
  let showRef = preview && params.has("ref") ? params.get("ref") : null;

  // ------------------------------------------------------------
  // Rendering
  // ------------------------------------------------------------
  const app = document.getElementById("app");

  const svgCheck = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;
  const svgSun = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  const svgMoon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;

  function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function themeButton() {
    const dark = currentTheme() === "dark";
    return `<button class="icon-btn" id="theme" aria-label="Switch to ${dark ? "light" : "dark"} theme" title="Theme">${dark ? svgSun : svgMoon}</button>`;
  }

  function rule(day, done) {
    let s = `<div class="rule" aria-hidden="true">`;
    for (let i = 1; i <= TOTAL; i++) {
      const cls = i < day ? "past" : i === day ? ("now" + (done ? " done" : "")) : "";
      s += `<i class="${cls}"></i>`;
    }
    return s + `</div>`;
  }

  function refName(id) { const r = REF.find(x => x.id === id); return r ? r.title : id; }
  function note(text) {
    if (!text) return "";
    const html = esc(text).replace(/\[\[(\w+)\]\]/g, (_, id) => `<button class="ref" data-ref="${id}">${refName(id)}</button>`);
    return `<div class="note">${html}</div>`;
  }
  function quest(id, text, checked, noteText) {
    return `<label class="q"><input type="checkbox" data-q="${id}" ${checked ? "checked" : ""}><span class="box">${svgCheck}</span><span class="txt">${text}${noteText ? note(noteText) : ""}</span></label>`;
  }
  function card(label, sections, prefix, isChecked, small, extraNote) {
    const all = sections.flatMap((sec, si) => sec.items.map((_, ii) => `${prefix}${si}.${ii}`));
    const done = all.filter(isChecked).length;
    const body = sections.map((sec, si) => `
      <div class="sec">
        <div class="sech">${esc(sec.h)}</div>
        ${sec.items.map((it, ii) => quest(`${prefix}${si}.${ii}`, esc(it), isChecked(`${prefix}${si}.${ii}`))).join("")}
        ${sec.n ? `<div class="secnote">${note(sec.n).replace(/^<div class="note">|<\/div>$/g, "")}</div>` : ""}
      </div>`).join("");
    return `<section class="card">
      <div class="label">${label}${small ? `<small>${small}</small>` : ""}<span class="prog">${done} of ${all.length}</span></div>
      ${body}
      ${extraNote ? `<div class="secnote theory">${note(extraNote).replace(/^<div class="note">|<\/div>$/g, "")}</div>` : ""}
    </section>`;
  }
  function openRef(id) { showRef = id; showAll = false; render(); const el = document.getElementById("ref-" + id); if (el) el.scrollIntoView({ block: "start" }); else scrollTo(0, 0); }

  function renderBegin() {
    const monday = nextMonday(new Date());
    const today = localMidnight(new Date());
    const isMonday = today.getDay() === 1;
    app.innerHTML = `
      <div class="screen">
        <div class="top" style="position:absolute;top:14px;right:16px;">${themeButton()}</div>
        <h1>Seventy-five<br>days, <em>one quest</em><br>set a day.</h1>
        <p>Two quests every day: theory and bench. Two more that never change: the log and a sketchbook page. A day is complete when every one is checked before you sleep.</p>
        <p>Day 1 is designed as a Monday. Where you learn each topic is your choice. Nothing is tracked. Everything stays on this device.</p>
        <div class="actions">
          ${isMonday
            ? `<button class="btn" data-begin="${toISO(today)}">Begin today</button>`
            : `<button class="btn" data-begin="${toISO(monday)}">Begin ${monday.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}</button>
               <button class="btn ghost" data-begin="${toISO(today)}">Begin today anyway</button>`}
        </div>
        <p class="fine">Miss a day and the sprint restarts at day 1. Illness or travel has a minimum quest, three times per sprint.</p>
      </div>`;
    bindCommon();
    app.querySelectorAll("[data-begin]").forEach(b => b.addEventListener("click", () => {
      store.set("startDate", b.dataset.begin);
      store.keys().filter(k => k.startsWith("day-")).forEach(k => store.del(k));
      render();
    }));
  }

  function renderWaiting(day) {
    const start = parseISO(store.get("startDate"));
    app.innerHTML = `
      <div class="screen">
        <div class="top" style="position:absolute;top:14px;right:16px;">${themeButton()}</div>
        <h1>Day one is<br><em>${fmtDate(start).split(",")[0]}</em>.</h1>
        <p>${fmtDate(start)}. ${-day + 1} ${(-day + 1) === 1 ? "day" : "days"} to go. Use them to order the equipment and open the sketchbook.</p>
        <div class="actions"><button class="btn ghost" id="reset">Start over</button></div>
      </div>`;
    bindCommon();
    app.querySelector("#reset").addEventListener("click", resetAll);
  }

  function renderFinished() {
    app.innerHTML = `
      <div class="screen">
        <div class="top" style="position:absolute;top:14px;right:16px;">${themeButton()}</div>
        <h1>Seventy-five<br>days. <em>Done.</em></h1>
        <p>You sat the exams, built the computer and the board, and drew every day. Write the sprint review from the log. Then begin again.</p>
        <div class="actions">
          <button class="btn" id="next">Begin Sprint 2</button>
          <button class="btn ghost" id="all">See Sprint 1 again</button>
        </div>
        <p class="fine">Sprint 2 is written on day 74 of this one, from the log, not from the roadmap.</p>
      </div>`;
    bindCommon();
    app.querySelector("#next").addEventListener("click", () => {
      if (confirm("Begin Sprint 2? This clears Sprint 1 checks on this device.")) {
        store.keys().filter(k => k.startsWith("day-")).forEach(k => store.del(k));
        store.set("startDate", toISO(localMidnight(new Date())));
        render();
      }
    });
    app.querySelector("#all").addEventListener("click", () => { showAll = true; render(); });
  }

  function renderAll(day) {
    let s = `<div class="rule" aria-hidden="true"></div>
      <div class="top"><div class="meta"><span>Sprint 1</span><span>All seventy-five</span></div>${themeButton()}</div>
      <div class="all"><h2>The whole sprint</h2><button class="back" id="back">← Back to today</button>`;
    for (let w = 0; w < 11; w++) {
      s += `<section class="week"><h3>Week ${w + 1}</h3><div class="theme">Sketch theme: ${THEMES[w]}</div>`;
      for (let i = w * 7; i < Math.min((w + 1) * 7, TOTAL); i++) {
        const n = i + 1, d = DAYS[i];
        s += `<div class="row ${n === day ? "today" : ""}">
          <div class="d">${n}<small>${DOW[i % 7].slice(0, 3)}</small></div>
          <div class="c">
            ${d.t.map(sec => `<span><b>${esc(sec.h)}</b>${sec.items.map(esc).join("; ")}</span>`).join("")}
            ${d.b.map(sec => `<span><b>${esc(sec.h)}</b>${sec.items.map(esc).join("; ")}</span>`).join("")}
          </div></div>`;
      }
      s += `</section>`;
    }
    s += `</div>`;
    app.innerHTML = s;
    bindCommon();
    app.querySelector("#back").addEventListener("click", () => { showAll = false; render(); scrollTo(0, 0); });
  }

  function renderDay(day) {
    const i = day - 1;
    const d = DAYS[i];
    const week = Math.floor(i / 7);
    const theme = THEMES[week];
    const checks = loadChecks(day);
    const ids = dayIds(d);
    const isChecked = id => checks.includes(id);
    const done = ids.every(isChecked);
    const weekend = i % 7 >= 5;

    const dateLine = preview
      ? DOW[i % 7]
      : fmtDate(new Date(parseISO(store.get("startDate")).getTime() + i * DAY_MS));

    app.innerHTML = `
      ${rule(day, done)}
      <div class="top">
        <div class="meta"><span>Sprint 1</span><span>${esc(dateLine)}</span>${preview ? `<span class="tag" style="margin-left:0">preview</span>` : ""}</div>
        ${themeButton()}
      </div>
      <div class="${done ? "done" : ""}" id="dayblock">
        <div class="day"><div class="num">${day}</div><div class="of">of seventy-five</div></div>
        <div class="sub">A <b>${DOW[i % 7]}</b>. ${weekend ? "Four hours of theory, four at the bench." : "Three hours of theory, one at the bench."} This week the sketchbook is <b>${theme}</b>.</div>
        <div class="complete-line">Day ${day} is complete. Rest.</div>
      </div>
      <div class="cards">
        ${card("Theory", d.t, "t", isChecked, weekend ? "four hours" : "three hours", d.tn)}
        ${card("Bench", d.b, "b", isChecked, weekend ? "four hours" : "one hour")}
        <section class="card every"><div class="label">Every day</div>
          ${quest("e1", "Log: hours by stream, what was done, what went wrong and why, every measurement.", isChecked("e1"), "Template in [[log]].")}
          ${quest("e2", `One sketchbook page. ${esc(theme.charAt(0).toUpperCase() + theme.slice(1))}.`, isChecked("e2"), "This week’s exercise in [[sketch]].")}
        </section>
      </div>
      <div class="foot">
        <button id="all">The whole sprint</button>
        <button class="ref" data-ref="equipment">Reference</button>
        ${preview ? "" : `<button id="reset">Start over</button>`}
        <span style="margin-left:auto">Nothing leaves this device.</span>
      </div>
      <details class="rules"><summary>Sprint rules</summary>
        <ul>
          <li>A day is complete only when every quest is checked before sleep.</li>
          <li>Miss a day and the sprint restarts at day 1.</li>
          <li>Illness or travel: the minimum quest is the log, a sketch page, and one hour of theory. It counts. At most three times per sprint.</li>
          <li>Quests are not reordered within a week. A late package or appointment means the fallback quest, not a skipped day.</li>
          <li>Theory is passed by exam at 80 percent, closed solutions. Bench work is passed by a working artifact with a number in the log.</li>
          <li>Quests name topics, not platforms. Learn each one from whatever source you choose.</li>
        </ul>
      </details>`;

    bindCommon();
    app.querySelectorAll("input[data-q]").forEach(cb => cb.addEventListener("change", () => {
      const now = loadChecks(day).filter(x => x !== cb.dataset.q);
      if (cb.checked) now.push(cb.dataset.q);
      saveChecks(day, now);
      const allDone = ids.every(id => now.includes(id));
      const block = app.querySelector("#dayblock");
      const was = block.classList.contains("done");
      block.classList.toggle("done", allDone);
      const seg = app.querySelector(".rule i.now");
      if (seg) seg.classList.toggle("done", allDone);
      if (allDone && !was && navigator.vibrate) { try { navigator.vibrate(12); } catch {} }
    }));
    app.querySelector("#all").addEventListener("click", () => { showAll = true; render(); scrollTo(0, 0); });
    const r = app.querySelector("#reset");
    if (r) r.addEventListener("click", resetAll);
  }

  function resetAll() {
    if (!confirm("Start over? This clears the start date and every check on this device.")) return;
    store.del("startDate");
    store.keys().filter(k => k.startsWith("day-")).forEach(k => store.del(k));
    showAll = false;
    render();
  }

  function bindCommon() {
    const t = app.querySelector("#theme");
    if (t) t.addEventListener("click", toggleTheme);
    app.querySelectorAll("button.ref").forEach(b => b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); openRef(b.dataset.ref); }));
  }

  function renderRef(day) {
    let s = `<div class="rule" aria-hidden="true"></div>
      <div class="top"><div class="meta"><span>Sprint 1</span><span>Reference</span></div>${themeButton()}</div>
      <div class="all"><h2>Reference</h2><button class="back" id="back">← Back to today</button>
      <nav class="refnav">${REF.map(r => `<button class="ref" data-ref="${r.id}">${r.title}</button>`).join("")}</nav>`;
    for (const r of REF) s += `<section class="refsec" id="ref-${r.id}"><h3>${r.title}</h3>${r.body}</section>`;
    s += `</div>`;
    app.innerHTML = s;
    bindCommon();
    app.querySelector("#back").addEventListener("click", () => { showRef = null; render(); scrollTo(0, 0); });
  }

  function render() {
    const day = computeDay();
    if (showRef) return renderRef(day ?? 0);
    if (showAll) return renderAll(day ?? 0);
    if (day === null) return renderBegin();
    if (day <= 0) return preview ? renderBegin() : renderWaiting(day);
    if (day > TOTAL) return renderFinished();
    renderDay(day);
  }

  render();

  // Re-render at local midnight so an open tab rolls to the next day.
  (function scheduleMidnight() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    setTimeout(() => { render(); scheduleMidnight(); }, next - now + 500);
  })();
})();
</script>
</body>
</html>
